<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유엘이키우기</title>
<meta name="description" content="카페를 키우며 성경 읽기·말씀 암송·오공완/오운완 인증으로 달란트를 모으는 게임">
<meta name="theme-color" content="#FFF4E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="유엘이키우기">
<meta name="application-name" content="유엘이키우기">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen phone app — HUD on top, isometric cafe (or stairs stage) in the middle, panels below, five tabs fixed at the bottom (cafe · deco · word · proof · stairs).
   Single light "afternoon-sun strawberry-milk cafe" look by choice; the canvas follows real time of day. */
:root{
  --milk:#FFF7F3;
  --card:#FFFFFF;
  --cocoa:#4A2E26;
  --cocoa-soft:#7E5F55;
  --line:#EFDCD5;
  --berry:#D9546F;
  --berry-soft:#FCE0E5;
  --sky:#4F82E6;
  --mint:#2F8F7A;
  --mint-soft:#DDF2EB;
  --gold:#E2A12E;
  --violet:#7253BD;
  --violet-soft:#EEE8FA;
  --heart:#E8637E;
  --shade:rgba(53,42,45,.40);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo',system-ui,sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --f-verse:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--milk);color:var(--cocoa);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--milk);display:flex;flex-wrap:nowrap;align-items:center;gap:6px;padding-block:10px 6px}
.hud .chip{flex:none}
.brand{font-family:var(--f-display);font-size:19px;color:var(--berry);margin-right:auto;white-space:nowrap;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 8px;font-family:var(--f-display);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
button.chip{cursor:pointer;min-height:32px}
.chip.icon{padding:4px 7px;color:var(--cocoa-soft)}
@media (max-width:400px){.brand{font-size:16px}.hud{gap:4px}.chip{padding:4px 7px;gap:5px}.lvbar{display:none}}
.coin{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);flex:none;display:inline-block}
.tal{width:13px;height:13px;background:var(--violet);transform:rotate(45deg);border-radius:3px;flex:none;display:inline-block}
.lvbar{width:30px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--mint)}

/* Cafe canvas */
.scene{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:var(--card)}
.scene canvas{display:block;width:100%;touch-action:pan-y}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.88);font-family:var(--f-display);font-size:20px;line-height:1;cursor:pointer;color:var(--cocoa)}
.todchip{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.85);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;pointer-events:none}
.fly{position:fixed;z-index:50;pointer-events:none;transition:transform .7s cubic-bezier(.45,-.25,.7,1),opacity .7s}

/* Stairs stage */
.stage{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:#BFE6F5;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.ghud{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.score{font-family:var(--f-display);font-size:44px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(46,42,74,.35);font-variant-numeric:tabular-nums}
.gauge{width:min(260px,80%);height:12px;border-radius:12px;background:rgba(255,255,255,.55);overflow:hidden;border:2px solid rgba(255,255,255,.9)}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#F2C94C,#E0607A);border-radius:10px}
.runcoin{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:5px;font-family:var(--f-display);color:#fff;text-shadow:0 1px 0 rgba(46,42,74,.35)}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;background:rgba(255,247,243,.92);text-align:center;overflow:auto}
.over h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px}
.over p{margin:0}
.over .big{font-family:var(--f-display);font-size:52px;line-height:1;color:var(--sky);font-variant-numeric:tabular-nums}
.over .col{display:flex;flex-direction:column;gap:8px;width:min(290px,100%)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pad{border:none;border-radius:20px;padding:20px 8px;font-family:var(--f-display);font-size:20px;cursor:pointer;touch-action:manipulation;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.pad.turn{background:var(--violet)}
.pad.up{background:var(--berry)}
.pad:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.pad small{display:block;font-family:var(--f-body);font-size:12px;opacity:.9}

/* Sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h2 small{font-family:var(--f-body);font-size:13px;color:var(--cocoa-soft)}
.note{font-size:14px;color:var(--cocoa-soft);margin:0}
.banner{display:flex;align-items:center;gap:12px;background:var(--berry-soft);border:none;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.banner b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.banner span{font-size:13px;color:var(--cocoa-soft)}
.banner .go{margin-left:auto;font-family:var(--f-display);color:var(--berry);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:96px;cursor:pointer;text-align:left;min-width:0}
.slot .nm{font-family:var(--f-display);font-size:16px}
.slot .sub{font-size:13px;color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.slot.empty{border-style:dashed;align-items:center;justify-content:center;color:var(--cocoa-soft)}
.slot.done{border-color:var(--mint);background:var(--mint-soft)}
.slot.add{border-style:dashed;align-items:center;justify-content:center;color:var(--violet)}
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--berry);transition:width .9s linear}
.bar.mint i{background:var(--mint)}
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.stk{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;font-variant-numeric:tabular-nums}
button.stk{cursor:pointer;min-height:40px}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--cocoa-soft)}
.stats b{color:var(--cocoa);font-family:var(--f-display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}

/* Regulars & missions */
.regs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.reg{flex:none;width:96px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
.reg canvas{width:52px;height:52px}
.reg b{font-family:var(--f-display);font-weight:400;font-size:15px}
.reg span{font-size:12px;color:var(--cocoa-soft)}
.reg .hearts{color:var(--heart);font-size:12px;letter-spacing:.05em}
.reg.lock{opacity:.5;cursor:default}
.newdot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--berry)}
.mis{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.mis .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mis .t b{font-family:var(--f-display);font-weight:400;font-size:15px}
.mis .t span{font-size:12px;color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.mis.done{border-color:var(--mint);background:var(--mint-soft)}
.mini{font-family:var(--f-display);font-size:14px;border:none;border-radius:12px;padding:9px 12px;background:var(--mint);color:#fff;cursor:pointer;white-space:nowrap;min-height:40px}
.mini:disabled{background:var(--line);color:var(--cocoa-soft);cursor:default}

.btn{font-family:var(--f-display);font-size:16px;border:none;border-radius:14px;padding:12px 16px;background:var(--berry);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.sky{background:var(--sky)}
.btn.ghost{background:var(--berry-soft);color:var(--cocoa)}
.btn.mint{background:var(--mint)}
.btn.violet{background:var(--violet)}
.btn.line{background:var(--card);border:1.5px solid var(--line);color:var(--cocoa)}
.btn:disabled{opacity:.45;cursor:default}
.btn .tal{background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1 1 0;min-width:0}
.toggle{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%;text-align:left;min-height:44px}
.toggle.on{border-color:var(--violet);background:var(--violet-soft)}
.toggle .t{flex:1;min-width:0;display:flex;flex-direction:column}
.toggle b{font-family:var(--f-display);font-weight:400;font-size:15px}
.toggle span{font-size:12px;color:var(--cocoa-soft)}
.toggle .sw2{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none}
.toggle .sw2::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on .sw2{background:var(--violet)}
.toggle.on .sw2::after{left:19px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;min-height:52px}
.item .t{display:flex;flex-direction:column;min-width:0;flex:1}
.item .t b{font-family:var(--f-display);font-weight:400;font-size:16px}
.item .t span{font-size:13px;color:var(--cocoa-soft)}
.item .price{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.on{border-color:var(--mint);background:var(--mint-soft)}
.item.lock{opacity:.5;cursor:default}
.sw{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);flex:none}
.setcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.setcard.done{border-color:var(--mint);background:var(--mint-soft)}
.setcard b{font-family:var(--f-display);font-weight:400;font-size:15px}
.setcard span{font-size:12px;color:var(--cocoa-soft)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--violet-soft);color:var(--violet);margin-left:4px}

/* 카페 탭: 지금 할 일 · 진열대 한 줄 · 단골/목표 버튼 */
.banner.done{background:var(--mint-soft)}
.banner.done .go{color:var(--mint)}
.banner.verse{background:var(--violet-soft)}
.banner.verse .go{color:var(--violet)}
.shelfline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.shelfline>b{font-family:var(--f-display);font-weight:400;font-size:17px;margin-right:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;min-height:64px}
.pbtn b{font-family:var(--f-display);font-weight:400;font-size:16px}
.pbtn>span{font-size:13px;color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.hearts{color:var(--heart)}
/* 꾸미기 탭: 안내 막대 · 종류 탭 · 그림 카드 */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:none;background:none;border-radius:10px;padding:8px 2px;font-family:var(--f-display);font-size:14px;color:var(--cocoa-soft);cursor:pointer;min-height:40px;white-space:nowrap}
.seg button.on{background:var(--berry-soft);color:var(--cocoa)}
/* 꾸미기: 카페 화면과 안내 막대는 위에 붙어 있고, 가구 목록만 아래로 스크롤된다 */
.topbox{display:flex;flex-direction:column;gap:8px}
.topbox.deco{position:sticky;top:var(--hudH,48px);z-index:5;background:var(--milk);padding-bottom:8px}
@media (max-height:700px){.topbox.deco{position:static}}
.topbox.deco~#view .card,.topbox.deco~#view .seg,.topbox.deco~#view .item,.topbox.deco~#view .sec{scroll-margin-top:calc(var(--dockTop,440px) + 12px);scroll-margin-bottom:96px}
.dbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px;min-height:58px}
.dbar.on{border-color:var(--violet);background:var(--violet-soft)}
.dbar .t{flex:1;min-width:0;font-size:13px;color:var(--cocoa-soft);line-height:1.4}
.dbar .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--cocoa)}
.dbar .btn{flex:none;min-height:42px;padding:8px 12px;font-size:15px}
.dbar.pv{flex-wrap:wrap;border-color:var(--violet);background:var(--violet-soft);padding:10px 12px 12px 14px;row-gap:8px}
.dbar.pv .t{flex:1 1 100%}
.dbar.pv .t b{display:flex;align-items:center;gap:2px}
.dbar .acts{display:flex;gap:8px;flex:1 1 100%}
.dbar .acts .btn:last-child{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.dbar .acts .btn.line{flex:none;background:var(--card)}
.dbar .up{font-weight:700;color:var(--violet)}
.dbar .lack{color:var(--heart);font-weight:700}
.btn.off{opacity:.55}
.todchip.pv{background:var(--violet);border-color:var(--violet);color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 6px 10px;cursor:pointer;min-width:0;text-align:center}
.card canvas{width:56px;height:56px}
.card b{font-family:var(--f-display);font-weight:400;font-size:14px;line-height:1.25;word-break:keep-all}
.card>span:last-child{font-size:12px;color:var(--cocoa-soft);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.card.on{border-color:var(--violet);background:var(--violet-soft);box-shadow:inset 0 0 0 1.5px var(--violet)}
.card.use{border-color:var(--mint);background:var(--mint-soft)}
.card .cnt{position:absolute;top:6px;right:6px;min-width:20px;height:20px;border-radius:10px;background:var(--mint);color:#fff;font-size:12px;line-height:20px;padding:0 6px}
.card .cnt.wk{background:var(--violet);font-size:11px}
.swb{display:block;width:56px;height:56px;border-radius:12px;border:1.5px solid var(--line);flex:none}
.swb.sm{width:44px;height:44px}
.swb.big{width:96px;height:96px;border-radius:20px}
.regs.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.regs.grid .reg{width:auto}
.stk.ok{border-color:var(--mint);background:var(--mint-soft)}
.sizes{display:flex;gap:4px}
.sizes span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--line);color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.sizes span.on{background:var(--mint);color:#fff}
/* 계단 시작 화면 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(300px,100%)}
.opt{display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;font-family:var(--f-display);font-size:14px;cursor:pointer;min-height:44px;color:var(--cocoa)}
.opt.on{border-color:var(--violet);background:var(--violet-soft)}
.linkbtn{border:none;background:none;color:var(--cocoa-soft);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px;min-height:36px}
/* 주간 말씀 카드 · 선물 */
.wcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wtop{display:flex;gap:12px;align-items:center}
.wtop b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.wtop span{font-size:13px;color:var(--cocoa-soft)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdays span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--cocoa-soft)}
.wdays i{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:13px}
.wdays .on i{background:var(--mint);border:none}
.wdays .now i{border-color:var(--berry)}
.giftcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.giftcard b{font-family:var(--f-display);font-weight:400;font-size:20px}
.giftcard span{font-size:14px;color:var(--cocoa-soft)}

/* Verse */
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--cocoa-soft)}
.stat.ok{background:var(--mint-soft);border-color:var(--mint)}
.vcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.vtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;color:#fff;background:var(--tc)}
.vno{font-size:12px;color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.vref{font-family:var(--f-display);font-size:22px;color:var(--tc)}
.vref.small{font-size:15px;color:var(--cocoa-soft)}
.vtext{font-family:var(--f-verse);font-size:19px;line-height:1.8;word-break:keep-all;margin:0}
.vtext b{color:var(--tc);font-weight:700}
.vtext .sl{color:var(--line);font-style:normal;margin:0 5px}
.vtext .blank{display:inline-block;border-bottom:2px solid var(--tc);color:transparent;min-width:2em}
.hint{font-family:var(--f-verse);font-size:19px;letter-spacing:.12em;color:var(--cocoa-soft);margin:0;word-break:keep-all}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--berry)}
.built{min-height:64px;font-family:var(--f-verse);font-size:17px;line-height:1.8;background:var(--milk);border-radius:12px;padding:10px 12px;word-break:keep-all}
.built .ph{color:var(--cocoa-soft);font-family:var(--f-body);font-size:14px}
.toks{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:8px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-family:var(--f-verse);font-size:16px;cursor:pointer;text-align:left;min-height:44px}
.tok.used{visibility:hidden}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mem:last-child{border-bottom:none}
.mem b{font-family:var(--f-display);font-weight:400;flex:1;min-width:0}
.mem span{color:var(--cocoa-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--mint)}
details summary{cursor:pointer;font-family:var(--f-display);font-size:16px;min-height:32px}
.bigt{font-family:var(--f-display);font-size:28px;color:var(--violet);text-align:center;margin:6px 0}
.story{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.story h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.story p{margin:0;font-size:16px;line-height:1.7;word-break:keep-all}
.story .who{font-size:13px;color:var(--cocoa-soft)}
.gift{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--cocoa);background:var(--card);resize:vertical}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--milk);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;border:none;background:none;font-size:15px;color:var(--cocoa-soft);cursor:pointer;padding:8px;min-height:40px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1.5px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:none;background:none;padding:10px 2px;border-radius:12px;font-family:var(--f-display);font-size:16px;color:var(--cocoa-soft);cursor:pointer;position:relative;min-height:44px}
.tabs button.on{background:var(--berry-soft);color:var(--cocoa)}
.tabs .bd{position:absolute;top:7px;right:calc(50% - 24px);width:8px;height:8px;border-radius:50%;background:var(--berry)}
.toasts{position:fixed;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{background:var(--cocoa);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;max-width:440px;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast,.shake{animation:none}.fly{display:none}}

/* ===================== 콘셉트 UI: "유엘이의 동화 카페" =====================
   나무 간판 · 크림색 종이 판 · 도톰한 그림 버튼 · 빨간 알림 점 · 노란 주 버튼 · 그림 아이콘 탭.
   버튼 수는 그대로 적게(한눈에), 결제 유도 버튼은 넣지 않는다. 그림과 아이콘은 모두 직접 그린 것. */
:root{--paper:#FFF8EC;--edge:#E6CBA0;--edge2:#EAD3AE;--wood:#A0673F;--wood-d:#5B3A33;--wood-l:#D29A66;--ink:#4A2E26}
body{background:#FFF4E8 radial-gradient(circle at 1px 1px,rgba(201,143,94,.13) 1.3px,transparent 1.6px) 0 0/18px 18px}
#app{gap:16px;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
/* 위: 유엘이 메달 + 레벨 · 코인 · 달란트(+ 누르면 말씀) · 설정 */
.hud{background:linear-gradient(#FFF4E8 80%,rgba(255,244,232,0));gap:6px;padding-block:10px 8px}
.me{position:relative;display:flex;align-items:center;gap:7px;border:none;background:none;padding:0;cursor:pointer;flex:1 1 auto;min-width:0;text-align:left}
.me .ava{width:50px;height:50px;border-radius:50%;flex:none;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(circle at 50% 40%,#FFF0F3,#F9C9D3);border:3px solid var(--wood);box-shadow:inset 0 0 0 2px #F7D9A8,0 3px 0 var(--wood-d)}
.me .ava svg{width:46px;height:auto;margin-top:1px}
.me .lv{position:absolute;left:32px;bottom:-5px;min-width:23px;height:23px;padding:0 5px;border-radius:12px;background:linear-gradient(#FFDD6E,#E9A928);border:2px solid #fff;color:#5B3A1E;font:15px/19px var(--f-display);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.me .who{display:flex;flex-direction:column;gap:5px;min-width:0}
.me .who b{font:16px/1.1 var(--f-display);font-weight:400;color:var(--berry);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #fff}
.xp{display:block;width:70px;height:8px;border-radius:8px;background:#EAD7BF;box-shadow:inset 0 1px 1px rgba(0,0,0,.15);overflow:hidden}
.xp i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#86D9B6,#3FA88A)}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 5px;border-radius:16px;background:rgba(74,46,38,.86);border:2px solid #7A4B33;box-shadow:inset 0 2px 0 rgba(255,255,255,.14);color:#fff;font-family:var(--f-display);font-size:15px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.pill b{font-weight:400}
button.pill{cursor:pointer;padding-right:5px}
.pill .coin{width:19px;height:19px;border:2px solid #FFF0B8;background:radial-gradient(circle at 35% 35%,#FFE48C,#E09A22);box-shadow:none}
.pill .tal{width:15px;height:15px;margin:0 2px;border:2px solid #E5D9FF;background:linear-gradient(135deg,#BCA2FF,#6E4FC0)}
.pill .plus{width:19px;height:19px;border-radius:50%;background:linear-gradient(#94E27E,#46A53A);border:1.5px solid #fff;font:15px/15px var(--f-display);text-align:center;margin-left:2px}
.gear{width:38px;height:38px;flex:none;padding:0;border-radius:50%;border:2.5px solid #6E4028;background:linear-gradient(#D29A66,#9A6340);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 3px 0 var(--wood-d);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gear svg{width:23px;height:23px}
@media (max-width:400px){.me .who b{font-size:14px}.xp{width:54px}.pill{font-size:14px;padding:0 8px 0 4px}}
@media (max-width:380px){.me .who b{display:none}.xp{width:46px}}
/* 카페 화면: 나무 액자 + 간판 */
.topbox{padding-top:12px}
.scene{overflow:visible;border:5px solid var(--wood);border-radius:24px;background:#FFEFD9;box-shadow:0 0 0 2px var(--wood-d),inset 0 0 0 2px #E8B97F,0 7px 0 rgba(110,64,40,.22)}
.scene canvas{border-radius:19px}
.sign{position:absolute;left:50%;top:-17px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:3}
.sign b{position:relative;display:block;padding:6px 18px 7px;font:18px/1 var(--f-display);font-weight:400;color:#FFF6E2;white-space:nowrap;letter-spacing:.02em;background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 5px,rgba(91,58,51,.12) 5px 6px),linear-gradient(#BC8152,#8A5533);border:2.5px solid var(--wood-d);border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 3px 0 rgba(91,58,51,.4);text-shadow:0 2px 0 var(--wood-d),0 0 2px var(--wood-d)}
.sign .rope{position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:#F2C94C;border:1.5px solid var(--wood-d);z-index:4}
.sign .rope.l{left:6px}.sign .rope.r{right:6px}
.sign .todchip,.todchip{position:static;margin-top:-2px;background:#FFF8EC;border:2px solid var(--wood-d);border-radius:999px;padding:1px 10px;font:12px/1.5 var(--f-display);color:var(--ink);white-space:nowrap;box-shadow:0 2px 0 rgba(91,58,51,.25)}
.todchip.pv{background:var(--violet);border-color:#3F2F70;color:#fff}
.side{position:absolute;left:8px;top:24px;display:flex;flex-direction:column;gap:6px;z-index:2}
.rbtn{position:relative;display:flex;flex-direction:column;align-items:center;width:52px;padding:0;border:none;background:none;cursor:pointer}
.rbtn svg{width:46px;height:46px;padding:6px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFFDF7,#F6DFBC);border:2.5px solid #7A4B33;box-shadow:0 3px 0 rgba(91,58,51,.38)}
.rbtn span{margin-top:-7px;font:12px/1 var(--f-display);color:#fff;text-shadow:0 1px 0 var(--wood-d),1px 0 0 var(--wood-d),-1px 0 0 var(--wood-d),0 -1px 0 var(--wood-d),1px 1px 0 var(--wood-d),-1px 1px 0 var(--wood-d)}
.bd{position:absolute;top:-3px;right:1px;width:19px;height:19px;border-radius:50%;background:linear-gradient(#FF7A7A,#E0393E);border:2px solid #fff;color:#fff;font:12px/15px var(--f-display);font-style:normal;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.zoom{top:12px;right:10px}
.zoom button{width:36px;height:36px;border-radius:50%;border:2.5px solid #7A4B33;background:radial-gradient(circle at 50% 35%,#FFFDF7,#F6DFBC);box-shadow:0 3px 0 rgba(91,58,51,.35);font:20px/1 var(--f-display);color:var(--ink)}
/* 지금 할 일: 종이 판 + 그림 + 노란 주 버튼 */
.banner,.banner.done,.banner.verse{background:linear-gradient(#FFFDF6,#FFF2DA);border:2.5px solid var(--edge);border-radius:20px;box-shadow:0 4px 0 var(--edge);padding:10px 10px 10px 10px;gap:10px}
.banner .bi{width:50px;height:50px;flex:none;border-radius:15px;background:#fff;border:2px solid var(--edge2);display:flex;align-items:center;justify-content:center}
.banner .bi svg{width:38px;height:38px}
.banner>div{min-width:0}
.banner small{display:block;font:11px/1.3 var(--f-display);color:#B07A4C;letter-spacing:.05em}
.banner b{font-size:17px;line-height:1.25}
.banner .go{margin-left:auto;flex:none;padding:11px 14px;border-radius:15px;font:16px/1 var(--f-display);white-space:nowrap;color:#5B3A1E;background:linear-gradient(#FFDE70,#F5AA2A);border:2.5px solid #C47C18;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #A9661A;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.banner.done .go{color:#fff;background:linear-gradient(#93E07E,#45A63A);border-color:#2E7A28;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #2E7A28;text-shadow:0 1px 0 #2E7A28}
.banner.verse .go{color:#fff;background:linear-gradient(#B9A0FF,#7253BD);border-color:#45338A;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 #45338A;text-shadow:0 1px 0 #45338A}
.banner.calm{cursor:default}
/* 종이 판 + 리본 제목 */
.panel{position:relative;margin-top:10px;padding:24px 12px 12px;background:linear-gradient(#FFFDF6,#FFF5E3);border:2.5px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--edge)}
.sec h2.ribbon,.ribbon{position:absolute;top:-15px;left:50%;transform:translateX(-50%);display:block;margin:0;padding:4px 20px 5px;font:16px/1.2 var(--f-display);font-weight:400;color:#fff;white-space:nowrap;background:linear-gradient(#F59BAE,#D9546F);border:2.5px solid #93384C;border-radius:11px;box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 3px 0 rgba(147,56,76,.35);text-shadow:0 1px 0 #93384C}
.slot{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:9px;row-gap:3px;align-items:center;align-content:center;background:#fff;border:2.5px solid var(--edge2);border-radius:17px;box-shadow:0 3px 0 var(--edge2);padding:10px;min-height:76px}
.slot .cupi{grid-row:1 / span 3;width:36px;height:36px;border-radius:13px;background:var(--mc);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.slot .cupi svg{width:28px;height:28px}
.slot .sub{word-break:keep-all;line-height:1.3}
.slot .nm{font-size:15px;line-height:1.2}
.slot.empty,.slot.add{border-style:dashed;background:#FFFBF4;box-shadow:none;justify-content:start;align-items:center}
.slot.add{grid-template-columns:1fr;text-align:center;justify-items:center}
.slot.done{border-color:#5FB89A;background:#E9F8F1;box-shadow:0 3px 0 #5FB89A}
.bar{height:8px;background:#F1E2CC}
.bar i{background:linear-gradient(90deg,#F7A1B4,#E0607A)}
.shelfline{margin-top:12px;padding-top:10px;border-top:2px dashed var(--edge2)}
/* 공통 버튼: 도톰하게 */
.btn{border:2.5px solid rgba(0,0,0,.16);background:linear-gradient(#F59BAE,#D9546F);box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 4px 0 rgba(120,40,60,.35);text-shadow:0 1px 0 rgba(0,0,0,.22);border-radius:16px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 2px 0 rgba(120,40,60,.35)}
.btn.sky{background:linear-gradient(#86B7F7,#4F82E6);box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 4px 0 #2F5CB0}
.btn.mint{background:linear-gradient(#62CFAB,#2F8F7A);box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 4px 0 #1F6656}
.btn.violet{background:linear-gradient(#AA90F4,#7253BD);box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 4px 0 #45338A}
.btn.cta{color:#5B3A1E;background:linear-gradient(#FFDE70,#F5AA2A);border-color:#C47C18;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 #A9661A;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn.line{color:var(--ink);background:linear-gradient(#FFFFFF,#FFF3E2);border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--edge);text-shadow:none}
.btn.ghost{color:var(--ink);background:linear-gradient(#FFF1F4,#FCD9E1);border-color:#EBB3C0;box-shadow:0 3px 0 #EBB3C0;text-shadow:none}
.btn .tal{background:#fff}
.mini{border:2px solid rgba(0,0,0,.14);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 #1F6656;background:linear-gradient(#62CFAB,#2F8F7A)}
.mini:disabled{box-shadow:none;border-color:transparent}
/* 종이 카드들 */
.item,.mis,.reg,.stat,.vcard,.wcard,.story,.toggle,.stk,.setcard,.pbtn,.opt,.tok{border:2px solid var(--edge2);box-shadow:0 3px 0 var(--edge2)}
.item.on,.mis.done,.stat.ok,.setcard.done,.stk.ok{border-color:#7CCBAE;box-shadow:0 3px 0 #7CCBAE}
.toggle.on,.opt.on{border-color:var(--violet);box-shadow:0 3px 0 var(--violet)}
.card{border:2.5px solid var(--edge2);border-radius:17px;box-shadow:0 3px 0 var(--edge2)}
.card.on{border-color:var(--violet);box-shadow:0 3px 0 var(--violet)}
.card.use{border-color:#5FB89A;box-shadow:0 3px 0 #5FB89A}
.ycards .card{padding-top:6px}
.ycards .card svg{width:60px;height:auto;border-radius:12px;background:radial-gradient(circle at 50% 40%,#FFF4F6,#FBE0E6)}
.card .tier{position:absolute;top:5px;left:7px;font-size:10px;letter-spacing:-1px;color:#E2A12E;z-index:1}
.card .tier.t1{color:#C9A07A}.card .tier.t2{color:#5FB3C9}.card .tier.t3{color:#8E6FD8}
.seg{background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 22px,rgba(91,58,51,.1) 22px 23px),linear-gradient(#BC8152,#8A5533);border:2.5px solid var(--wood-d);border-radius:17px;padding:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.22)}
.seg button{color:#FFEBD2;text-shadow:0 1px 0 var(--wood-d)}
.seg button.on{color:var(--ink);text-shadow:none;background:linear-gradient(#FFFDF6,#FFE6C2);box-shadow:0 2px 0 rgba(91,58,51,.4)}
.dbar{background:linear-gradient(#FFFDF6,#FFF2DA);border:2.5px solid var(--edge);border-radius:17px;box-shadow:0 3px 0 var(--edge)}
.dbar.on,.dbar.pv{background:linear-gradient(#F8F4FF,#EDE5FD);border-color:var(--violet);box-shadow:0 3px 0 var(--violet)}
/* 아래 탭: 나무 판 + 그림 아이콘, 지금 탭은 동그랗게 솟아오른다 */
.tabs{background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 40px,rgba(91,58,51,.12) 40px 41px),linear-gradient(#BC8152,#7E4C30);border-top:3px solid var(--wood-d);box-shadow:inset 0 2px 0 rgba(255,255,255,.18);padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;padding:2px 2px 2px;min-height:58px;color:#FFEBD2;background:none}
.tabs .ti{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .18s}
.tabs .ti svg{width:31px;height:31px}
.tabs .tl{font:13px/1.15 var(--f-display);text-shadow:0 1px 0 var(--wood-d)}
.tabs button.on{background:none;color:#FFE38A}
.tabs button.on .ti{transform:translateY(-9px) scale(1.1);background:radial-gradient(circle at 50% 35%,#FFFDF7,#FFE1A0);border:3px solid #E9B949;box-shadow:0 0 0 2.5px var(--wood-d),0 4px 0 rgba(0,0,0,.25)}
.tabs button.on .tl{margin-top:-4px}
.tabs .bd{top:0;right:calc(50% - 26px);width:19px;height:19px;border-radius:50%;background:linear-gradient(#FF7A7A,#E0393E);font:12px/15px var(--f-display);color:#fff;text-align:center}
/* 시트: 크림색 종이 */
.sheet{background:linear-gradient(#FFFDF6,#FFF4E0);border-top:4px solid var(--edge)}
.toast{background:rgba(74,46,38,.94);border:2px solid #E9B949}
/* 하늘계단 무대 */
.stage{border:5px solid var(--wood);box-shadow:0 0 0 2px var(--wood-d),0 7px 0 rgba(110,64,40,.22)}
.over{background:rgba(255,248,236,.94)}
/* 유엘이 옷장 */
.wsheet{gap:10px}
.wcardbox{width:min(100%,296px);margin:0 auto;filter:drop-shadow(0 6px 12px rgba(91,58,51,.2))}
.wcardbox>svg{display:block;width:100%;height:auto}
.wrow{display:flex;flex-direction:column;gap:6px}
.wrow>b{font:15px var(--f-display);font-weight:400}
.wthumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 7px;scroll-snap-type:x proximity}
.wthumb{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:#fff;border:2.5px solid var(--edge2);border-radius:15px;box-shadow:0 3px 0 var(--edge2);cursor:pointer;scroll-snap-align:start}
.wthumb svg{width:56px;height:auto;border-radius:11px;background:radial-gradient(circle at 50% 40%,#FFF4F6,#FBE0E6)}
.wthumb b{font:12px/1.2 var(--f-display);font-weight:400;text-align:center;word-break:keep-all}
.wthumb span{font-size:11px;color:var(--cocoa-soft);display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.wthumb.on{border-color:var(--violet);background:var(--violet-soft);box-shadow:0 3px 0 var(--violet)}
.wthumb.lock svg{filter:saturate(.75) brightness(.97)}
.wact{position:sticky;bottom:-20px;display:flex;flex-direction:column;gap:8px;padding:12px 0 6px;background:linear-gradient(rgba(255,244,224,0),#FFF4E0 26%)}
.wact .btn{width:100%}
.lackn{text-align:center;color:var(--heart)}
/* ===== 성경 읽기 · 사진 인증 · 달란트 받는 법 ===== */
.tabs div{grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tabs button{min-width:0}
.tabs .tl{white-space:nowrap}
.toasts{z-index:60}
.vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{position:relative}
.seg .bd{top:-9px;right:2px}
.prog{height:10px;border-radius:10px;background:#F1E2CC;overflow:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.12);margin-top:-4px}
.prog i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#C9B6FF,#7253BD)}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.bk{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 6px 6px;background:#fff;border:2px solid var(--edge2);border-radius:13px;box-shadow:0 2px 0 var(--edge2);cursor:pointer;min-width:0;text-align:center}
.bk b{font:14px/1.2 var(--f-display);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bk.long b{font-size:12px;letter-spacing:-.03em}
.bk .bb{height:5px;border-radius:5px;background:#F1E2CC;overflow:hidden}
.bk .bb i{display:block;height:100%;background:#9C83E8;border-radius:5px}
.bk .bn{font-size:11px;color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.bk.done{background:#F6F2FF;border-color:#C9B6FF;box-shadow:0 2px 0 #C9B6FF}
.bk.done .bn{color:var(--violet)}
.bk.now{border-color:#E9B949;box-shadow:0 2px 0 #E9B949;background:#FFFBEA}
.chs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.ch{position:relative;min-height:44px;border-radius:12px;border:2px solid var(--edge2);background:#fff;box-shadow:0 2px 0 var(--edge2);font:16px var(--f-display);color:var(--ink);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.ch.on{background:linear-gradient(#CDBBFF,#9C83E8);border-color:#7253BD;color:#fff;box-shadow:0 2px 0 #45338A;text-shadow:0 1px 0 #45338A}
.ch.nx{border-color:#E9B949;box-shadow:0 2px 0 #C47C18;background:#FFF7DD}
.ch.td::after{content:'✓';position:absolute;top:-7px;right:-5px;width:18px;height:18px;border-radius:50%;background:#45A63A;border:2px solid #fff;color:#fff;font:11px/14px var(--f-display);text-shadow:none}
/* 읽는 화면: 나무 머리띠 + 종이 */
body.rdopen{overflow:hidden}
.reader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#FFFBF3}
.rdhead{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 40px,rgba(91,58,51,.12) 40px 41px),linear-gradient(#BC8152,#8A5533);border-bottom:3px solid var(--wood-d);color:#FFF6E2}
.rdb{flex:none;min-width:40px;height:40px;border-radius:12px;border:2px solid var(--wood-d);background:linear-gradient(#FFFDF6,#FFE6C2);color:var(--ink);font:22px/1 var(--f-display);cursor:pointer;padding:0 8px;box-shadow:0 2px 0 rgba(91,58,51,.45)}
.rdb.txt{font-size:14px;padding:0 7px}
.rdb.on{background:linear-gradient(#B9A0FF,#7253BD);color:#fff;border-color:#3F2F70}
.rdt{flex:1;min-width:0;display:flex;flex-direction:column}
.rdt b{font:18px/1.2 var(--f-display);font-weight:400;text-shadow:0 1px 0 var(--wood-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdt span{font-size:12px;color:#FFE7C6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 20px 30px;font-family:var(--f-verse);line-height:1.9;color:#3E2A24;width:100%;max-width:680px;margin:0 auto}
.rdbody p{margin:0 0 .6em;word-break:keep-all;overflow-wrap:anywhere}
.rdbody sup{font:.62em/1 var(--f-display);color:#B07A4C;margin-right:5px;vertical-align:.5em}
.rdbody .rdmsg{font-family:var(--f-body);color:var(--cocoa-soft);text-align:center;margin-top:30px}
.rdend{display:flex;flex-direction:column;gap:9px;margin:26px 0 6px;font-family:var(--f-body);font-size:15px;line-height:1.5}
.rdend .btn{width:100%}
.rddone{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border-radius:16px;background:#F6F2FF;border:2px solid #C9B6FF;text-align:center}
.rddone b{font:22px var(--f-display);font-weight:400;color:var(--violet)}
.rddone span{font-size:13px;color:var(--cocoa-soft)}
.rdfoot{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(#FFF8EC,#FFEFD6);border-top:2.5px solid var(--edge)}
.rdfoot span{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--cocoa-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:13px}
/* 인증 탭 */
.pcards{display:grid;grid-template-columns:1fr;gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:linear-gradient(#FFFDF6,#FFF5E3);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.pcard.done{background:linear-gradient(#FFFFFF,#F1FAF5);border-color:#9AD7BE;box-shadow:0 4px 0 #9AD7BE}
.ptop{display:flex;align-items:center;gap:10px}
.pic{width:50px;height:50px;flex:none;border-radius:15px;background:#fff;border:2px solid var(--edge2);display:flex;align-items:center;justify-content:center}
.pic svg{width:38px;height:38px}
.pt{display:flex;flex-direction:column;min-width:0;flex:1}
.pt b{font:20px/1.15 var(--f-display);font-weight:400;color:var(--pc)}
.pt span{font-size:13px;color:var(--cocoa-soft)}
.pok{flex:none;font:14px var(--f-display);color:#fff;background:linear-gradient(#93E07E,#45A63A);border:2px solid #2E7A28;border-radius:999px;padding:3px 10px}
.pweek{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;font-size:13px;color:var(--cocoa-soft);flex-wrap:wrap}
.pweek .wd{display:flex;gap:4px}
.pweek .wd i{width:24px;height:24px;border-radius:50%;background:#F3E6D3;font:11px/24px var(--f-display);font-style:normal;text-align:center;color:#A2856F}
.pweek .wd i.on{background:var(--pc);color:#fff}
.pweek .wd i.now{box-shadow:0 0 0 2px #E9B949}
.phbox{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:2px solid var(--edge2);border-radius:13px;overflow:hidden;background:#F6EBDD;cursor:pointer}
.phbox img{width:100%;height:100%;object-fit:cover;display:block}
.phbox.none::before{content:'사진 없음';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#A2856F}
.pdone{display:flex;align-items:center;gap:12px}
.phbox.mini{width:92px;flex:none;border-radius:15px}
.pdt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;flex:1}
.pdt b{font:17px/1.2 var(--f-display);font-weight:400;color:var(--pc)}
.pdt span{font-size:13px;color:var(--cocoa-soft);word-break:keep-all;overflow-wrap:anywhere}
.btn.cta .tal{background:linear-gradient(135deg,#BCA2FF,#6E4FC0);border:1.5px solid #fff}
.phbox.big{aspect-ratio:auto;cursor:default;min-height:200px}
.phbox.big img{height:auto;max-height:62vh;object-fit:contain}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tagk,.tagd{position:absolute;font:11px/1.5 var(--f-display);font-style:normal;color:#fff;padding:0 6px;border-radius:8px}
.tagk{left:4px;bottom:4px}
.tagd{right:4px;top:4px;background:rgba(74,46,38,.7)}
.phprev{display:block;width:100%;max-height:44vh;object-fit:contain;border-radius:16px;background:#F6EBDD;border:2px solid var(--edge2)}
.memo{width:100%;font:16px var(--f-body);padding:11px 12px;border-radius:13px;border:2px solid var(--edge2);background:#fff;color:var(--ink)}
.memo:focus{outline:3px solid var(--violet);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--edge2);background:#fff;border-radius:999px;padding:6px 12px;font:13px var(--f-display);color:var(--ink);cursor:pointer;min-height:36px}
.phmemo{margin:0;font-size:15px;text-align:center;color:var(--ink)}
.stampbox{display:flex;justify-content:center;padding:14px 0 2px}
.stamp{font:34px/1 var(--f-display);color:var(--pc);border:5px solid var(--pc);border-radius:18px;padding:12px 22px;transform:rotate(-8deg);background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 3px #fff;animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav b{font:17px var(--f-display);font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:11px;text-align:center;color:var(--cocoa-soft)}
.cal .dd{aspect-ratio:1;min-width:0;border-radius:10px;background:#fff;border:1.5px solid var(--edge2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:var(--ink);cursor:pointer}
.cal .dd:disabled{cursor:default;background:#FFFBF4;color:#B9A08C}
.cal .dd b{font:13px/1 var(--f-display);font-weight:400}
.cal .dd.td{border-color:#E9B949;box-shadow:0 0 0 1.5px #E9B949}
.cal .dd.out{visibility:hidden}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--cocoa-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend.big{font-size:14px}
.legend.big i{width:9px;height:9px}
.k1{background:#7253BD}.k2{background:#E0607A}.k4{background:#4F82E6}.k8{background:#2F9E6E}
/* 달란트 받는 법 */
.earn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:16px;background:#fff;border:2px solid var(--edge2);box-shadow:0 3px 0 var(--edge2);cursor:pointer}
.earn.ok{border-color:#7CCBAE;box-shadow:0 3px 0 #7CCBAE;background:#F4FBF8}

.earn .t{display:flex;flex-direction:column;min-width:0;flex:1}
.earn .t b{font:16px/1.25 var(--f-display);font-weight:400}
.earn .t span{font-size:12.5px;color:var(--cocoa-soft);line-height:1.35}
.earn .es{flex:none;font:13px var(--f-display);color:var(--violet);background:var(--violet-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* 홈 화면 앱 안내 */
.banner.appb{position:relative;cursor:default;padding-right:34px}
.banner.appb .go{cursor:pointer;color:#fff;background:linear-gradient(#F59BAE,#D9546F);border-color:#93384C;box-shadow:inset 0 2px 0 rgba(255,255,255,.38),0 3px 0 #93384C;text-shadow:0 1px 0 #93384C}
.appx{position:absolute;top:4px;right:6px;width:28px;height:28px;border:none;background:none;font:20px/1 var(--f-display);color:#B07A4C;cursor:pointer;padding:0}
.howto{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.howto .n{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(#FFDE70,#F5AA2A);border:2px solid #C47C18;font:14px/22px var(--f-display);text-align:center;color:#5B3A1E}

.steps2 ol{margin:0;padding-left:20px;line-height:1.6}
.okline{margin:0;font:18px var(--f-display);color:#2E7A28}
.urlbox{background:#fff;border:2px dashed var(--edge);border-radius:12px;padding:10px 12px;word-break:break-all;font-size:14px}
a.btn{text-decoration:none}

/* ===== 하늘계단 v8 ===== */
.ghud{gap:5px}
.score{font-size:42px;text-shadow:0 2px 0 rgba(46,42,74,.45),0 0 10px rgba(46,42,74,.2)}
.gbar{display:flex;align-items:center;gap:5px;width:min(270px,84%)}

.fbar{position:relative;width:min(190px,58%);height:15px;border-radius:10px;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.85);overflow:hidden;opacity:0;transition:opacity .25s}

.fbar span{position:absolute;inset:0;font:10.5px/11px var(--f-display);color:#4A2E26;text-align:center;padding-top:.5px}

.runcoin{background:rgba(74,46,38,.55);border-radius:999px;padding:2px 9px 2px 4px}
.pads{gap:12px;margin-top:14px}
.pad{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px 9px;border:2.5px solid rgba(0,0,0,.16);border-radius:22px;font-family:var(--f-display);text-shadow:0 1px 0 rgba(0,0,0,.25);transition:transform .06s}
.pad b{font-weight:400;font-size:20px;line-height:1.15}

.over.start{justify-content:space-between;padding:12px 12px 14px;background:linear-gradient(rgba(255,248,236,0) 0%,rgba(255,248,236,0) 30%,rgba(255,248,236,.5) 48%,rgba(255,248,236,.9) 64%)}

function gainExp(n){
  S.exp += n;
  while (S.exp >= need(S.lv)) {
    S.exp -= need(S.lv); S.lv++;
    const opened = MENUS.filter(m => m.lv === S.lv).map(m => m.name);

  }

function saleOf(m, mult){
  const gain = Math.round(m.price * mult);

  gainExp(Math.ceil(m.price / 2));
  return gain;
}
/* 매력 1점당 판매가 +0.25% — 가구를 다 모으면(매력 약 290) 1.7배. 0.4%는 밸런스 봇에서 2주 만에 모든 것을 샀다 */
const saleMult = () => (1 + charm() * 0.0025) * (1 + bonusPct() / 100);

/* 손님 시뮬레이션 — 진열대에 있는 만큼만 팔린다. 자리를 비워도 손해가 없다(최대 8시간 정산) */
function sim(now){
  const dt = Math.min(now - S.last, 8 * 3600e3) / 1000;
  S.last = now;
  if (dt <= 0) return { n:0, g:0 };
  S.acc += dt;
  const iv = interval(), mult = saleMult();
  let n = 0, g = 0;
  while (S.acc >= iv && n < 2000) {
    const avail = MENUS.filter(m => (S.stock[m.id] || 0) > 0);
    if (!avail.length) { S.acc = Math.min(S.acc, iv); break; }
    S.acc -= iv;
    const m = avail[Math.floor(Math.random() * avail.length)];
    S.stock[m.id]--;
    g += saleOf(m, mult); n++;
  }
  return { n, g };
}

function pickMissions(date){
  let h = 7;
  for (const ch of date) h = (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0;
  const ids = Object.keys(MISSIONS), out = [];
  for (let guard = 0; out.length < 3 && guard < 50; guard++) {
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
    const id = ids[(h >>> 4) % ids.length];
    if (!out.find(o => o.id === id)) { const m = MISSIONS[id]; out.push({ id, n:m.opts[(h >>> 12) % m.opts.length] }); }
  }
  return out;
}

function regState(r){ return S.regs[r.id] || (S.regs[r.id] = { hearts:0, read:0, gifted:false, next:0, vip:false, visits:0 }); }
const regUnlocked = r => S.lv >= r.lv;
/* 이야기는 단골마다 하루에 한 편씩 — 자주 들르는 날도 이야기가 한꺼번에 쏟아지지 않게(밸런스 봇: 이틀이면 30편이 다 열렸다) */

const storyWait = r => { const st = regState(r); return regUnlocked(r) && st.read < 5 && st.hearts >= STORY_TH[st.read] && st.day === today(); };

/* 방문 1회: 하트 +1, 좋아하는 메뉴가 진열돼 있으면 +1 더. 단골이 VIP면 팁 */

function settleAwayRegulars(){

  REGULARS.filter(regUnlocked).forEach(r => {
    const st = regState(r);
    if (!st.next) { scheduleReg(st, true); return; }
    if (now >= st.next + 60e3) {
      const visits = Math.min(3, 1 + Math.floor((now - st.next) / (40 * 60e3)));
      let h = 0; for (let i = 0; i < visits; i++) h += regVisitReward(r);

      if (nc < (cost.get(nk) ?? Infinity)) { cost.set(nk, nc); came.set(nk, k); open.push([nc + Math.abs(nx - tx) + Math.abs(ny - ty), nc, nk]); }

}

function drawClimber(x, y, SX){

function wrapLines(txt, maxW, maxN){
  const words = txt.split(' '), out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }

  return out;
}

  if (of.hat === 'rain') { ctx.fillStyle = '#F1C64A'; ctx.beginPath(); ctx.ellipse(0, -41, 13, 6, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(-13, -42, 26, 3); }
  else if (of.hat === 'crown') { ctx.fillStyle = '#F1C64A'; ctx.beginPath(); ctx.moveTo(-8, -42); ctx.lineTo(-8, -50); ctx.lineTo(-4, -46); ctx.lineTo(0, -52); ctx.lineTo(4, -46); ctx.lineTo(8, -50); ctx.lineTo(8, -42); ctx.closePath(); ctx.fill(); }

  function wings(){

    const wing = s => `<g transform="translate(100 186) scale(${s * 1.55} 1.55)">` +
      [30, 14, -2, -18, -34, -50].map((a, i) => fe(a, 50 - i * 2, 30 - i, 8.5)).join('') +
      [36, 20, 4, -12, -28, -44].map(a => fe(a, 32, 22, 8)).join('') +
      [42, 24, 6, -12, -30].map(a => fe(a, 15, 14, 7.5)).join('') + '</g>';
    return wing(-1) + wing(1);
  }

  /* ---------- 한 사람 전체(200×440). ex: smile · joy · wink · calm ---------- */
  function figure(o, ex = 'smile', id = 'y', hs = 'long', bustOnly = false){
    const sp = SPEC[o.id];
    return `<defs>
        <linearGradient id="${id}iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A2314"/><stop offset=".5" stop-color="#9C5128"/><stop offset="1" stop-color="#F0AE5E"/></linearGradient>

        <linearGradient id="${id}wg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EDE6F7"/><stop offset=".6" stop-color="#FFFFFF"/></linearGradient>
      </defs>
      ${bustOnly && o.id === 'rain' ? '' : behind(o).replace(/WINGG/g, id + 'wg')}
      ${hairBackStyle(hs, o, id).replace(/ID_hb/g, id + '_hb')}
      ${neck()}
      ${outfitBody(o, id)}
      ${hairMid(hs, o, id)}
      ${face(ex, id)}
      ${hairFront(id, hs)}
      ${hairTies(hs, o, id)}
      ${headwear(o, hs)}`;
  }
  /* 얼굴만(목록 그림 · 상단 프로필 · 카드 표정 칸) */
  function bust(o, ex = 'smile', id = 'b', size = 64, hs = 'long'){
    return `<svg viewBox="30 -14 140 160" width="${size}" height="${Math.round(size * 160 / 140)}" aria-hidden="true">${figure(o, ex, id, hs, true)}</svg>`;
  }

  /* ---------- 카드 장식: 종이 · 금색 덩굴 테두리 · 배경 무늬 ---------- */
  function motif(kind, W, Hh, col){

function rollRead(){ const R = S.read, d = today(); if (R.day !== d) { R.day = d; R.n = 0; R.cnt = 0; R.list = []; } }
function bits(b){
  const R = S.read, n = BOOKS[b][1]; let s = R.ch[b];
  if (typeof s !== 'string' || s.length !== n) s = R.ch[b] = String(s || '').replace(/[^01]/g, '0').padEnd(n, '0').slice(0, n);
  return s;
}
const isRead = (b, c) => bits(b)[c] === '1';
const setRead = (b, c) => { const s = bits(b); S.read.ch[b] = s.slice(0, c) + '1' + s.slice(c + 1); };

/* 이어 읽을 장: 마지막으로 연 장이 아직이면 그 장, 읽었으면 그다음부터 처음 나오는 안 읽은 장 */
function nextUnread(){
  const L0 = S.read.last; let b = L0 ? L0.b : 0, c = L0 ? L0.c : 0;
  if (!BOOKS[b] || c >= BOOKS[b][1]) { b = 0; c = 0; }
  for (let k = 0; k <= TOTAL_CH; k++) {
    if (!isRead(b, c)) return { b, c };
    if (++c >= BOOKS[b][1]) { c = 0; b = (b + 1) % 66; }
  }
  return { b:0, c:0 };
}
const BIBLE = new Map();

const PHOTO = (() => {

    try { const r = indexedDB.open('yuel-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }

  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('p', mode), q = fn(t.objectStore('p'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

}

/* 목록 그림은 카페를 그리는 함수로 그대로 그린다 — 생김새가 기능을 말하게(U-UX-03) */
const ICONS = {};
function furnIcon(t){
  if (ICONS[t]) return ICONS[t];
  const c = document.createElement('canvas'); c.width = c.height = 240;
  const g = c.getContext('2d'), keep = [X, TW, TH, OX, OY];
  X = g; TW = 120; TH = 60; OX = 120; OY = 170 - TH / 2;
  poly([P(0, 0), P(1, 0), P(1, 1), P(0, 1)], 'rgba(239,220,213,.8)');
  const it = { id:0, t, x:0, y:0, r:FMAP[t].seat ? 1 : 0 };
  if (FMAP[t].seat) { drawSeatBase(it); drawSeatBack(it); } else drawFurn(it);
  [X, TW, TH, OX, OY] = keep;
  const d = g.getImageData(0, 0, 240, 240).data; let x0 = 240, y0 = 240, x1 = 0, y1 = 0;
  for (let y = 0; y < 240; y++) for (let x = 0; x < 240; x++) if (d[(y * 240 + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return (ICONS[t] = { c, x0, y0, w:Math.max(1, x1 - x0 + 1), h:Math.max(1, y1 - y0 + 1) });
}
function skinIcon(id){
  const key = 'skin:' + id; if (ICONS[key]) return ICONS[key];
  const K = SKMAP[id], c = document.createElement('canvas'); c.width = c.height = 240;
  const g = c.getContext('2d'), keep = [X, TW, TH, OX, OY, WH], n = 3;
  X = g; TW = 64; TH = 32; WH = TW * 1.2; OX = 120; OY = 40 + WH;
  drawFloor(K, n, false);
  poly([P(0, 0), P(0, n), P(0, n, WH), P(0, 0, WH)], sh(K.wall, .1)); poly([P(0, 0), P(n, 0), P(n, 0, WH), P(0, 0, WH)], K.wall);
  wallPattern(K, n, false);
  X.lineWidth = 3; X.strokeStyle = K.trim; X.beginPath(); X.moveTo(...P(0, n, WH)); X.lineTo(...P(0, 0, WH)); X.lineTo(...P(n, 0, WH)); X.stroke();
  bc(1.5, 1, 1.4, .6, 0, .5 * TW, K.counter);
  [X, TW, TH, OX, OY, WH] = keep;
  return (ICONS[key] = { c, x0:120 - 3 * 32 - 2, y0:40 - 4, w:3 * 64 + 4, h:WH + 3 * 32 + 8 });
}
function drawDecoIcons(){

    const g = c.getContext('2d'), ic = skinIcon(c.dataset.skin), s = Math.min((c.width - 8) / ic.w, (c.height - 8) / ic.h);
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    g.drawImage(ic.c, ic.x0, ic.y0, ic.w, ic.h, (c.width - ic.w * s) / 2, (c.height - ic.h * s) / 2, ic.w * s, ic.h * s);
  });
  document.querySelectorAll('canvas[data-icon]').forEach(c => {
    const g = c.getContext('2d'), ic = furnIcon(c.dataset.icon), pad = 8, s = Math.min((c.width - pad * 2) / ic.w, (c.height - pad * 2) / ic.h);
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    g.drawImage(ic.c, ic.x0, ic.y0, ic.w, ic.h, (c.width - ic.w * s) / 2, c.height - pad - ic.h * s, ic.w * s, ic.h * s);
  });

  if (S.tab === 'cafe' && doneNow.some((v, i) => v && !wasDone[i])) refreshCafePanel();
  wasDone = doneNow;
  if (vis && S.tab === 'cafe') setChip();
  renderTabs();
  if (now - lastSave > 5000) { save(); lastSave = now; }
}
function start(data){
  S = (data && data.S) || load();
  ensureDay();
  const r = sim(Date.now());
  const regs = settleAwayRegulars();
  if (r.n || regs.length) AWAY = { ...(AWAY || {}), n:r.n, g:r.g, regs };
  newRun(); buildNav();
  renderAll();
  showOver('start');
  if (S.tab === 'stairs') fit();
  save();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseRun(); save(); } else { tick(); if (!document.getElementById('scene').hidden) cafeLoop(); } });
  window.addEventListener('pagehide', save);
  window.addEventListener('resize', () => { if (S.tab === 'stairs') fit(); if (S.tab === 'cafe' || S.tab === 'deco') { fitCafe(); stickyTops(); } });
  try { if (navigator.storage && navigator.storage.persist && !S.set.persist) navigator.storage.persist().then(ok => { S.set.persist = !!ok; }).catch(() => {}); } catch(e) {}
  showAway();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
